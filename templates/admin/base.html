<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}مدیریت وبلاگ{% endblock %}</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}"></head><body><div class="admin-shell"><aside class="sidebar"><a class="admin-brand" href="{{ url_for('dashboard') }}">AMIR<span>.</span> <small>مدیریت</small></a><nav><a href="{{ url_for('dashboard') }}">◫ داشبورد</a><a href="{{ url_for('admin_posts') }}">▤ مقالات</a><a href="{{ url_for('create_post') }}">＋ مقاله جدید</a><a href="{{ url_for('admin_messages') }}">✉ پیام‌ها</a><a href="{{ url_for('home') }}" target="_blank">↗ مشاهده وبلاگ</a></nav><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="logout-btn">خروج از حساب</button></form></aside><main class="admin-main"><div class="admin-top"><span>پنل مدیریت وبلاگ</span><a href="{{ url_for('home') }}">مشاهده سایت ↗</a></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ 'success' if category=='success' else 'danger' }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></div><script src="{{ url_for('static',filename='js/admin.js') }}"></script></body></html>
