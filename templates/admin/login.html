<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیر</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}"></head><body class="login-page"><form method="post" class="login-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><a class="admin-brand" href="{{ url_for('home') }}">AMIR<span>.</span></a><h1>ورود به مدیریت</h1><p>برای مدیریت نوشته‌ها وارد حساب خودت شو.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-danger">{{ message }}</div>{% endfor %}{% endwith %}<label>نام کاربری<input class="form-control" name="username" autocomplete="username" required autofocus></label><label>رمز عبور<input class="form-control" type="password" name="password" autocomplete="current-password" required></label><button class="btn btn-primary w-100 mt-3">ورود</button><a class="back-link" href="{{ url_for('home') }}">بازگشت به وبلاگ</a></form></body></html>
