{% extends 'admin/base.html' %}{% block title %}{{ page_title }}{% endblock %}{% block content %}<div class="admin-heading"><div><span class="eyebrow">EDITOR</span><h1>{{ page_title }}</h1><p>اطلاعات مقاله را وارد کن.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('admin_posts') }}">بازگشت</a></div><form method="post" enctype="multipart/form-data" class="editor-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>عنوان مقاله<input class="form-control" name="title" maxlength="200" value="{{ post.title if post else '' }}" required></label><label>متن مقاله<textarea class="form-control" name="description" rows="15" required>{{ post.description if post else '' }}</textarea><small>متن ساده با حفظ خط‌های جدید نمایش داده می‌شود.</small></label><div class="row g-3"><div class="col-md-6"><label>دسته‌بندی<select class="form-select" name="category">{% for category in categories %}<option value="{{ category }}" {% if post and post.category==category %}selected{% elif not post and category=='یادداشت‌ها' %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></label></div><div class="col-md-6"><label>وضعیت انتشار<select class="form-select" name="status">{% for status,label in [('draft','پیش‌نویس'),('published','منتشر شود'),('archived','آرشیو')] %}<option value="{{ status }}" {% if post and post.status==status %}selected{% elif not post and status=='draft' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label></div></div><label>تصویر شاخص <input class="form-control" type="file" name="image" accept="image/png,image/jpeg,image/webp"><small>حداکثر ۵ مگابایت؛ JPG، PNG یا WEBP.</small></label>{% if post and post.image_field %}<img class="editor-preview" src="{{ image_url(post.image_field) }}" alt="تصویر فعلی">{% endif %}<button class="btn btn-primary mt-2">ذخیره مقاله</button></form>{% endblock %}
